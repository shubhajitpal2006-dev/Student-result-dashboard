<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student Result Dashboard</h1>
    <div class="container">
    <label>Student Name: <input type="text" id="studentName"></label>
    <br><br>
    <label>Roll Number: <input type="number" id="rollNumber"></label>
    <br><br>
    <label>History: <input type="number" id="history"></label>
    <br><br>
    <label>Geography: <input type="number" id="geography"></label>
    <br><br>
    <label>Mathematics: <input type="number" id="mathematics"></label>
    <br><br>
    <label>English: <input type="number" id="english"></label>
    <br><br>
    <label>Science: <input type="number" id="science"></label>
    <br><br>
    <button id="calculateBtn">Calculate Result</button><br><br>
    <button id="resetBtn">Reset</button><br><br>
    <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
